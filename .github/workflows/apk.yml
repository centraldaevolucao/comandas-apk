name: Gerar APK
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Conferir arquivos obrigatórios
        run: test -f app/src/main/assets/public.zip || (echo 'FALTA app/src/main/assets/public.zip (o .gitignore não pode ignorá-lo)'; exit 1)
      - name: Baixar cloudflared (link externo temporário)
        run: |
          set -e
          base=https://github.com/cloudflare/cloudflared/releases/latest/download
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64
          curl -fsSL "$base/cloudflared-linux-arm64" -o app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          curl -fsSL "$base/cloudflared-linux-arm"   -o app/src/main/jniLibs/armeabi-v7a/libcloudflared.so
          curl -fsSL "$base/cloudflared-linux-amd64" -o app/src/main/jniLibs/x86_64/libcloudflared.so
          chmod +x app/src/main/jniLibs/*/libcloudflared.so
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: Restaurante-app, path: app/build/outputs/apk/debug/app-debug.apk }
