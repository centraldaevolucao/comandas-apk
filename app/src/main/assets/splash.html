<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurante-app</title><style>html,body{margin:0;height:100%;background:linear-gradient(160deg,#E91E63,#AD1457 70%,#880E4F)}.sp-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center;font-family:system-ui,-apple-system,Roboto,sans-serif;color:#fff}
.sp-bars rect{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:spCresce .7s cubic-bezier(.2,.9,.3,1.2) forwards}
.sp-bars .b1{animation-delay:.1s}.sp-bars .b2{animation-delay:.3s}.sp-bars .b3{animation-delay:.5s}.sp-bars .b4{animation-delay:.7s}
.sp-seta{stroke-dasharray:190;stroke-dashoffset:190;animation:spTraco 1s .9s ease-out forwards}
.sp-ponta{opacity:0;animation:spAparece .3s 1.8s forwards}
.sp-logo{filter:drop-shadow(0 6px 14px rgba(0,0,0,.25));animation:spFlutua 3s 2s ease-in-out infinite}
.sp-nome{font-size:1.7rem;font-weight:800;letter-spacing:.5px;margin-top:18px;opacity:0;animation:spSobe .6s 1.1s forwards}
.sp-slogan{font-size:1.05rem;margin-top:8px;opacity:0;animation:spSobe .7s 1.5s forwards;color:#ffe0ec}
.sp-pontos{display:flex;gap:7px;margin-top:26px;opacity:0;animation:spAparece .4s 1.9s forwards}
.sp-pontos i{width:9px;height:9px;border-radius:50%;background:#fff;animation:spPulsa 1s infinite ease-in-out}
.sp-pontos i:nth-child(2){animation-delay:.15s}.sp-pontos i:nth-child(3){animation-delay:.3s}
@keyframes spCresce{to{transform:scaleY(1)}}
@keyframes spTraco{to{stroke-dashoffset:0}}
@keyframes spAparece{to{opacity:1}}
@keyframes spSobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spFlutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spPulsa{0%,80%,100%{transform:scale(.5);opacity:.5}40%{transform:scale(1);opacity:1}}
</style></head><body><div class="sp-wrap">
  <svg class="sp-logo" viewBox="0 0 160 140" width="150" height="131" aria-hidden="true">
    <g class="sp-bars" fill="#fff">
      <rect class="b1" x="18"  y="88" width="22" height="40" rx="6"/>
      <rect class="b2" x="50"  y="66" width="22" height="62" rx="6"/>
      <rect class="b3" x="82"  y="44" width="22" height="84" rx="6"/>
      <rect class="b4" x="114" y="20" width="22" height="108" rx="6"/>
    </g>
    <polyline class="sp-seta" points="14,76 58,52 90,60 134,12" fill="none" stroke="#ffd54f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline class="sp-ponta" points="112,10 134,12 130,34" fill="none" stroke="#ffd54f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="sp-nome">Restaurante-app</div>
  <div class="sp-slogan">Aqui seu empreendimento cresce</div>
  <div class="sp-pontos"><i></i><i></i><i></i></div>
</div>
</body></html>
